<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON SCOOTER 3D - JJ Art Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #050510;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* HUD: 100vw 대신 left/right 및 100% 기준으로 기기 폭에 맞춤 */
    #hud {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(10, 15, 35, 0.78);
      border: 1px solid #00f3ff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      min-width: 0;
    }
    .hud-label { font-size: 10px; color: #00f3ff; letter-spacing: 1px; }
    .hud-val { font-size: 20px; font-weight: 800; margin-top: 2px; white-space: nowrap; }

    /* Item Floating Toast & Fever Banner */
    #toast-msg {
      position: absolute; top: 82px; left: 50%; transform: translateX(-50%);
      font-size: 18px; font-weight: 900; letter-spacing: 1px; white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none; z-index: 12;
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
    }
    #toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

    #fever-bar-wrap {
      position: absolute; top: 114px; left: 50%; transform: translateX(-50%);
      width: min(220px, 70%); text-align: center; pointer-events: none; z-index: 12;
    }
    .fever-text { font-size: 12px; font-weight: 800; color: #ffe600; text-shadow: 0 0 8px #ff9900; margin-bottom: 4px; }
    .fever-track { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
    #fever-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ffe600, #ff8800); }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 16, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 16px;
      overflow-y: auto;
    }
    .hidden { display: none !important; }
    h1 { font-size: clamp(24px, 7vw, 34px); letter-spacing: 1.5px; color: #00f3ff; text-shadow: 0 0 20px #00f3ff, 0 0 40px #ff007f; margin-bottom: 10px; }
    p { color: #b8c4e0; font-size: 14px; max-width: 400px; line-height: 1.6; margin-bottom: 14px; word-break: keep-all; }
    .item-guide {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px;
      background: rgba(255,255,255,0.06); padding: 10px 14px; border-radius: 14px; font-size: 12.5px;
    }
    #art-status { font-size: 13px; color: #ff77b7; margin-bottom: 14px; font-weight: 600; }

    /* Scooter Color Picker */
    .picker-wrap { margin-bottom: 20px; width: 100%; }
    .picker-label { font-size: 12px; color: #94a3b8; letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 700; }
    .color-options { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .color-swatch {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .color-swatch.active {
      transform: scale(1.22); border-color: #fff;
      box-shadow: 0 0 14px var(--c), 0 0 24px var(--c);
    }

    button.main-btn { background: linear-gradient(90deg, #00f3ff, #ff007f); border: none; color: #fff; font-size: 17px; font-weight: bold; padding: 14px 34px; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); transition: transform 0.15s; }
    button.main-btn:active { transform: scale(0.95); }

    /* Mobile Controls: 화면 폭 안에 정확히 들어오도록 absolute + 안전 여백 적용 */
    #mobile-controls {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }
    .ctrl-btn {
      pointer-events: auto;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .ctrl-btn:active { background: rgba(0, 243, 255, 0.45); }
    #btn-boost {
      width: 88px;
      height: 54px;
      border-radius: 30px;
      border-color: #ff007f;
      background: rgba(255, 0, 127, 0.22);
      font-size: 14px;
      font-weight: bold;
    }
    #btn-boost:active { background: rgba(255, 0, 127, 0.5); }
  </style>
</head>
<body>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="score">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">SPEED</div>
      <div class="hud-val"><span id="speed">15</span> km/h</div>
    </div>
  </div>

  <div id="toast-msg">🍙 +100점!</div>
  <div id="fever-bar-wrap" class="hidden">
    <div class="fever-text">🍌 바나나우유 파워 무적!</div>
    <div class="fever-track"><div id="fever-fill"></div></div>
  </div>

  <div id="start-screen" class="overlay">
    <h1>🛴 NEON SCOOTER 3D</h1>
    <p>JJ의 작품 큐브를 피해 킥보드로 달려요!</p>
    <div class="item-guide">
      <span>🍙 삼김: <b>+100점</b></span>
      <span>🍌 바나나우유: <b>5초 무적질주</b></span>
    </div>
    <div id="art-status">🎨 갤러리에서 작품 불러오는 중...</div>

    <div class="picker-wrap">
      <div class="picker-label">SELECT SCOOTER COLOR</div>
      <div class="color-options" id="color-options"></div>
    </div>

    <button class="main-btn" id="start-btn">RIDE START</button>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1 style="color:#ff007f;">OOPS! CRASH!</h1>
    <p>최종 점수: <strong id="final-score" style="color:#fff; font-size:22px;">0</strong></p>
    <button class="main-btn" id="restart-btn">RIDE AGAIN</button>
  </div>

  <div id="mobile-controls">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-boost">BOOST</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
