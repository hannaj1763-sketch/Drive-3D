<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON DRIVE 3D - 1st Person</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      touch-action: none;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* HUD */
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(10, 15, 35, 0.78);
      border: 1px solid #00f3ff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }
    .hud-label { font-size: 10px; color: #00f3ff; letter-spacing: 1px; }
    .hud-val { font-size: 20px; font-weight: 800; margin-top: 2px; }

    /* Toast & Fever Bar */
    #toast-msg {
      position: fixed;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    #fever-bar-wrap {
      position: fixed;
      top: 114px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      text-align: center;
      pointer-events: none;
      z-index: 12;
    }
    .fever-text { font-size: 11px; font-weight: 800; color: #ffe600; text-shadow: 0 0 8px #ff9900; margin-bottom: 4px; }
    .fever-track { width: 100%; height: 7px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
    #fever-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ffe600, #ff8800); }

    /* Overlay Screens */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 16, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    .hidden { display: none !important; }
    h1 {
      font-size: 28px;
      letter-spacing: 1.5px;
      color: #00f3ff;
      text-shadow: 0 0 18px #00f3ff, 0 0 36px #ff007f;
      margin-bottom: 10px;
    }
    p { color: #b8c4e0; font-size: 13px; max-width: 340px; line-height: 1.5; margin-bottom: 14px; }
    .item-guide {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 18px;
      background: rgba(255,255,255,0.07);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
    }

    /* Color Picker */
    .picker-wrap { margin-bottom: 22px; }
    .picker-label { font-size: 11px; color: #94a3b8; letter-spacing: 1.2px; margin-bottom: 10px; font-weight: 700; }
    .color-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .color-swatch {
      width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .color-swatch.active {
      transform: scale(1.2); border-color: #fff;
      box-shadow: 0 0 14px var(--c), 0 0 22px var(--c);
    }

    button.main-btn {
      background: linear-gradient(90deg, #00f3ff, #ff007f);
      border: none;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      padding: 13px 34px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      transition: transform 0.15s;
    }
    button.main-btn:active { transform: scale(0.95); }

    /* Mobile Controls */
    #mobile-controls {
      position: fixed;
      bottom: 20px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }
    .ctrl-btn {
      pointer-events: auto;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 243, 255, 0.16);
      border: 2px solid #00f3ff;
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .ctrl-btn:active { background: rgba(0, 243, 255, 0.45); }
    #btn-boost {
      width: 88px;
      height: 54px;
      border-radius: 30px;
      border-color: #ff007f;
      background: rgba(255, 0, 127, 0.24);
      font-size: 14px;
      font-weight: bold;
    }
    #btn-boost:active { background: rgba(255, 0, 127, 0.52); }
  </style>
</head>
<body>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="score">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">SPEED</div>
      <div class="hud-val"><span id="speed">35</span> km/h</div>
    </div>
  </div>

  <div id="toast-msg">🍙 +100점!</div>
  <div id="fever-bar-wrap" class="hidden">
    <div class="fever-text">🍌 바나나우유 파워 무적!</div>
    <div class="fever-track"><div id="fever-fill"></div></div>
  </div>

  <div id="start-screen" class="overlay">
    <h1>🚘 NEON DRIVE 1ST</h1>
    <p>1인칭 운전석 시점으로 네온 큐브를 피해 달려요!</p>
    <div class="item-guide">
      <span>🍙 삼김: <b>+100점</b></span>
      <span>🍌 바나나우유: <b>5초 무적질주</b></span>
    </div>

    <div class="picker-wrap">
      <div class="picker-label">🎨 운전석 네온 컬러 선택</div>
      <div class="color-options" id="color-options"></div>
    </div>

    <button class="main-btn" id="start-btn">DRIVE START</button>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1 style="color:#ff007f;">OOPS! CRASH!</h1>
    <p>최종 점수: <strong id="final-score" style="color:#fff; font-size:22px;">0</strong></p>
    <button class="main-btn" id="restart-btn">DRIVE AGAIN</button>
  </div>

  <div id="mobile-controls">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-boost">BOOST</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const COCKPIT_COLORS = [
      { id: 'cyan',   hex: '#00f3ff', body: 0x00f3ff, emissive: 0x004466, accent: 0xff0055 },
      { id: 'pink',   hex: '#ff2a85', body: 0xff2a85, emissive: 0x550022, accent: 0x00f3ff },
      { id: 'gold',   hex: '#ffcc00', body: 0xffcc00, emissive: 0x553300, accent: 0xff3300 },
      { id: 'lime',   hex: '#00ff88', body: 0x00ff88, emissive: 0x004411, accent: 0xffff00 },
      { id: 'violet', hex: '#b829ff', body: 0xb829ff, emissive: 0x330055, accent: 0x00f3ff },
      { id: 'white',  hex: '#f8fafc', body: 0xf8fafc, emissive: 0x334155, accent: 0xff0033 }
    ];

    let selectedColorId = localStorage.getItem('drive3d_cockpit_color') || 'cyan';

    let cockpitNeonMat, cockpitAccentMat, shieldMesh;
    let scene, camera, renderer, playerCar, steeringWheel, gridHelper;
    let obstacles = [];
    let items = [];
    let obstacleMat;

    let isPlaying = false, isBoosting = false;
    let score = 0, currentLane = 0; // -1, 0, 1
    const laneWidth = 3.2;
    let shakeTime = 0;

    let invincibleEnd = 0;
    const INVINCIBLE_DUR = 5000;

    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const toastEl = document.getElementById('toast-msg');
    const feverWrapEl = document.getElementById('fever-bar-wrap');
    const feverFillEl = document.getElementById('fever-fill');

    let toastTimer = null;
    function showToast(text, color = '#00ff88') {
      toastEl.textContent = text;
      toastEl.style.color = color;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100);
    }

    function setupColorPicker() {
      const container = document.getElementById('color-options');
      container.innerHTML = COCKPIT_COLORS.map(c => `
        <div class="color-swatch ${c.id === selectedColorId ? 'active' : ''}" 
             style="background:${c.hex}; --c:${c.hex};"
             data-id="${c.id}"></div>
      `).join('');

      container.querySelectorAll('.color-swatch').forEach(el => {
        el.onclick = () => {
          selectedColorId = el.dataset.id;
          localStorage.setItem('drive3d_cockpit_color', selectedColorId);
          container.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          el.classList.add('active');
          applyCockpitColor();
        };
      });
    }

    function applyCockpitColor() {
      const c = COCKPIT_COLORS.find(x => x.id === selectedColorId) || COCKPIT_COLORS[0];
      if (cockpitNeonMat && cockpitAccentMat) {
        cockpitNeonMat.color.setHex(c.body);
        cockpitNeonMat.emissive.setHex(c.emissive);
        cockpitAccentMat.color.setHex(c.accent);
      }
    }

    function buildCockpit() {
      playerCar = new THREE.Group();

      const dashDarkMat = new THREE.MeshStandardMaterial({
        color: 0x0b0f1e, roughness: 0.65, metalness: 0.3
      });
      cockpitNeonMat = new THREE.MeshStandardMaterial({
        color: 0x00f3ff, emissive: 0x004466, metalness: 0.6, roughness: 0.25
      });
      cockpitAccentMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });

      const dashBase = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.55, 0.9), dashDarkMat);
      dashBase.position.set(0, 0.55, -1.15);
      dashBase.rotation.x = 0.12;
      playerCar.add(dashBase);

      const neonTrim = new THREE.Mesh(new THREE.BoxGeometry(2.82, 0.035, 0.04), cockpitNeonMat);
      neonTrim.position.set(0, 0.83, -0.72);
      playerCar.add(neonTrim);

      const pillarGeo = new THREE.CylinderGeometry(0.035, 0.045, 1.35, 8);
      const leftPillar = new THREE.Mesh(pillarGeo, dashDarkMat);
      leftPillar.position.set(-1.25, 1.35, -0.95);
      leftPillar.rotation.z = -0.22;
      leftPillar.rotation.x = -0.35;
      playerCar.add(leftPillar);

      const rightPillar = new THREE.Mesh(pillarGeo, dashDarkMat);
      rightPillar.position.set(1.25, 1.35, -0.95);
      rightPillar.rotation.z = 0.22;
      rightPillar.rotation.x = -0.35;
      playerCar.add(rightPillar);

      const frameBorder = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.38, 0.05), cockpitNeonMat);
      frameBorder.position.set(0.32, 0.95, -0.92);
      frameBorder.rotation.y = -0.18;
      frameBorder.rotation.x = -0.08;
      playerCar.add(frameBorder);

      const navScreen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.56, 0.32),
        new THREE.MeshBasicMaterial({ color: 0x091326 })
      );
      navScreen.position.set(0.32, 0.95, -0.892);
      navScreen.rotation.y = -0.18;
      navScreen.rotation.x = -0.08;
      playerCar.add(navScreen);

      steeringWheel = new THREE.Group();
      steeringWheel.position.set(-0.36, 0.78, -0.68);
      steeringWheel.rotation.x = -0.35;

      const wheelRing = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.028, 12, 28), dashDarkMat);
      steeringWheel.add(wheelRing);

      const topMarker = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.065, 0.065), cockpitAccentMat);
      topMarker.position.set(0, 0.26, 0);
      steeringWheel.add(topMarker);

      const spokeH = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.04, 0.03), cockpitNeonMat);
      steeringWheel.add(spokeH);

      const spokeV = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.24, 0.03), cockpitNeonMat);
      spokeV.position.set(0, -0.12, 0);
      steeringWheel.add(spokeV);

      const centerHub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.05, 16), dashDarkMat);
      centerHub.rotation.x = Math.PI / 2;
      steeringWheel.add(centerHub);

      playerCar.add(steeringWheel);

      const shieldGeo = new THREE.SphereGeometry(2.1, 20, 16);
      const shieldMat = new THREE.MeshBasicMaterial({
        color: 0xffe600, wireframe: true, transparent: true, opacity: 0.28
      });
      shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
      shieldMesh.position.set(0, 1.1, -1.2);
      shieldMesh.visible = false;
      playerCar.add(shieldMesh);

      scene.add(playerCar);
    }

    function createSamgimMesh() {
      const group = new THREE.Group();
      const riceGeo = new THREE.CylinderGeometry(0.75, 0.75, 0.42, 3);
      riceGeo.rotateX(Math.PI / 2);
      riceGeo.rotateY(Math.PI);
      const rice = new THREE.Mesh(riceGeo, new THREE.MeshStandardMaterial({
        color: 0xffffff, emissive: 0x333333, roughness: 0.4
      }));
      group.add(rice);

      const nori = new THREE.Mesh(
        new THREE.BoxGeometry(0.82, 0.34, 0.46),
        new THREE.MeshStandardMaterial({ color: 0x0f1a12, emissive: 0x051108, roughness: 0.7 })
      );
      nori.position.set(0, -0.22, 0);
      group.add(nori);

      const label = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.16, 0.48),
        new THREE.MeshBasicMaterial({ color: 0xff2a55 })
      );
      label.position.set(0, -0.20, 0);
      group.add(label);

      return group;
    }

    function createBananaMilkMesh() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0xffe853, emissive: 0x665500, roughness: 0.25
      });

      const bottom = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.36, 0.45, 16), bodyMat);
      bottom.position.y = -0.25;
      group.add(bottom);

      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.46, 0.45, 16), bodyMat);
      top.position.y = 0.2;
      group.add(top);

      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.33, 0.33, 0.08, 16),
        new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x064e3b })
      );
      cap.position.y = 0.45;
      group.add(cap);

      const straw = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 0.55, 8),
        new THREE.MeshBasicMaterial({ color: 0xff6b00 })
      );
      straw.position.set(0.08, 0.65, 0);
      straw.rotation.z = -0.22;
      group.add(straw);

      return group;
    }

    function onResize() {
      const w = document.body.clientWidth || window.innerWidth;
      const h = document.body.clientHeight || window.innerHeight;
      if (!w || !h) return;

      camera.aspect = w / h;
      const baseFov = (w / h) < 0.75 ? 76 : 65;
      camera.userData.baseFov = baseFov;
      camera.fov = baseFov;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050510, 0.02);

      const w = document.body.clientWidth || window.innerWidth;
      const h = document.body.clientHeight || window.innerHeight;
      camera = new THREE.PerspectiveCamera(72, w / h, 0.1, 200);
      camera.position.set(-0.22, 1.38, -0.12);
      camera.lookAt(0, 1.05, -18);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);
      onResize();

      const ambient = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.1);
      dirLight.position.set(4, 10, 6);
      scene.add(dirLight);

      obstacleMat = new THREE.MeshStandardMaterial({
        color: 0x1e1b4b, emissive: 0x4c0519, roughness: 0.25, metalness: 0.4
      });

      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 300),
        new THREE.MeshStandardMaterial({ color: 0x0b0d1f, roughness: 0.8 })
      );
      road.rotation.x = -Math.PI / 2;
      road.position.z = -120;
      scene.add(road);

      gridHelper = new THREE.GridHelper(300, 60, 0xff007f, 0x1e254d);
      gridHelper.position.y = 0.02;
      gridHelper.position.z = -120;
      scene.add(gridHelper);

      buildCockpit();
      setupColorPicker();
      applyCockpitColor();

      window.addEventListener('resize', () => {
        onResize();
        setTimeout(onResize, 150);
      });
      window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

      setupControls();
      animate();
    }

    function spawnRow() {
      const lanes = [-1, 0, 1];
      const obsLane = lanes[Math.floor(Math.random() * lanes.length)];
      
      const geo = new THREE.BoxGeometry(2.1, 2.1, 2.1);
      const obs = new THREE.Mesh(geo, obstacleMat);
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xff007f }));
      obs.add(line);

      obs.position.set(obsLane * laneWidth, 1.05, -130);
      obs.userData = { blasted: false, vx: 0, vy: 0 };
      scene.add(obs);
      obstacles.push(obs);

      if (Math.random() < 0.45) {
        const freeLanes = lanes.filter(l => l !== obsLane);
        const itemLane = freeLanes[Math.floor(Math.random() * freeLanes.length)];
        const isBanana = Math.random() < 0.32;

        const mesh = isBanana ? createBananaMilkMesh() : createSamgimMesh();
        mesh.position.set(itemLane * laneWidth, 0.95, -130);
        mesh.userData = { type: isBanana ? 'banana' : 'samgim' };
        scene.add(mesh);
        items.push(mesh);
      }
    }

    function resetGame() {
      onResize();
      obstacles.forEach(o => scene.remove(o));
      obstacles = [];
      items.forEach(it => scene.remove(it));
      items = [];
      score = 0;
      currentLane = 0;
      playerCar.position.x = 0;
      isBoosting = false;
      invincibleEnd = 0;
      shieldMesh.visible = false;
      feverWrapEl.classList.add('hidden');
      isPlaying = true;
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
    }

    function gameOver() {
      isPlaying = false;
      shakeTime = 18;
      invincibleEnd = 0;
      shieldMesh.visible = false;
      feverWrapEl.classList.add('hidden');
      finalScoreEl.textContent = Math.floor(score);
      gameoverScreen.classList.remove('hidden');
    }

    function moveLane(dir) {
      if (!isPlaying) return;
      currentLane = Math.max(-1, Math.min(1, currentLane + dir));
    }

    function setupControls() {
      document.getElementById('start-btn').onclick = resetGame;
      document.getElementById('restart-btn').onclick = resetGame;

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') isBoosting = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') isBoosting = false;
      });

      const btnLeft = document.getElementById('btn-left');
      const btnRight = document.getElementById('btn-right');
      const btnBoost = document.getElementById('btn-boost');

      btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLane(-1); });
      btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveLane(1); });
      btnLeft.addEventListener('mousedown', () => moveLane(-1));
      btnRight.addEventListener('mousedown', () => moveLane(1));

      btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
      btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });
      btnBoost.addEventListener('mousedown', () => isBoosting = true);
      btnBoost.addEventListener('mouseup', () => isBoosting = false);
    }

    let spawnTimer = 0;
    function animate(now = 0) {
      requestAnimationFrame(animate);

      const isInvincible = isPlaying && now < invincibleEnd;
      const baseSpeed = isPlaying ? (0.45 + Math.min(score * 0.00012, 0.5)) : 0.18;
      const currentSpeed = isInvincible ? baseSpeed * 1.55 : (isBoosting && isPlaying ? baseSpeed * 1.45 : baseSpeed);

      if (isInvincible) {
        shieldMesh.visible = true;
        shieldMesh.rotation.z += 0.05;
        feverWrapEl.classList.remove('hidden');
        const ratio = Math.max(0, (invincibleEnd - now) / INVINCIBLE_DUR);
        feverFillEl.style.width = (ratio * 100) + '%';
      } else {
        shieldMesh.visible = false;
        feverWrapEl.classList.add('hidden');
      }

      gridHelper.position.z += currentSpeed;
      if (gridHelper.position.z > -90) gridHelper.position.z = -120;

      const targetX = currentLane * laneWidth;
      const diffX = targetX - playerCar.position.x;
      playerCar.position.x += diffX * 0.17;
      playerCar.rotation.z = -diffX * 0.04;

      if (steeringWheel) {
        steeringWheel.rotation.z = -diffX * 0.85;
      }

      const baseFov = camera.userData.baseFov || 72;
      const targetFov = (isInvincible || (isBoosting && isPlaying)) ? baseFov + 12 : baseFov;
      camera.fov += (targetFov - camera.fov) * 0.1;
      camera.updateProjectionMatrix();

      const roadBounce = isPlaying ? Math.sin(now * 0.035) * 0.008 : 0;
      if (shakeTime > 0) {
        camera.position.x = playerCar.position.x - 0.22 + (Math.random() - 0.5) * 0.35;
        camera.position.y = 1.38 + (Math.random() - 0.5) * 0.35;
        shakeTime--;
      } else {
        camera.position.x = playerCar.position.x - 0.22;
        camera.position.y = 1.38 + roadBounce;
      }

      if (isPlaying) {
        score += currentSpeed * (isInvincible ? 3.0 : (isBoosting ? 2.2 : 1));
        scoreEl.textContent = Math.floor(score);
        speedEl.textContent = Math.floor(currentSpeed * 65);

        spawnTimer += currentSpeed;
        if (spawnTimer > 26) {
          spawnRow();
          spawnTimer = 0;
        }

        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.position.z += currentSpeed;
          it.rotation.y += 0.05;
          it.position.y = 0.95 + Math.sin(now * 0.006 + i) * 0.15;

          if (Math.abs(it.position.z - playerCar.position.z) < 2.2 &&
              Math.abs(it.position.x - playerCar.position.x) < 1.35) {
            if (it.userData.type === 'samgim') {
              score += 100;
              showToast('🍙 삼김 파워! +100점', '#00ff88');
            } else {
              invincibleEnd = now + INVINCIBLE_DUR;
              score += 50;
              showToast('🍌 바나나우유! 5초 무적질주!', '#ffe600');
            }
            scene.remove(it);
            items.splice(i, 1);
            continue;
          }

          if (it.position.z > 8) {
            scene.remove(it);
            items.splice(i, 1);
          }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          
          if (obs.userData.blasted) {
            obs.position.x += obs.userData.vx;
            obs.position.y += obs.userData.vy;
            obs.position.z -= currentSpeed * 0.5;
            obs.rotation.x += 0.15;
            obs.rotation.z += 0.15;
          } else {
            obs.position.z += currentSpeed;

            if (Math.abs(obs.position.z - playerCar.position.z) < 2.1 &&
                Math.abs(obs.position.x - playerCar.position.x) < 1.25) {
              if (isInvincible) {
                obs.userData.blasted = true;
                obs.userData.vx = (Math.random() < 0.5 ? -1 : 1) * 0.65;
                obs.userData.vy = 0.55;
                score += 30;
                shakeTime = 6;
                showToast('💥 큐브 격파! +30점', '#ff77b7');
              } else {
                gameOver();
              }
            }
          }

          if (obs.position.z > 8 || obs.position.y > 25) {
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
