<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON DRIVE 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: 'Segoe UI', sans-serif; color: #fff; }
    #game-canvas { display: block; width: 100vw; height: 100vh; }
    
    /* HUD */
    #hud { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(10, 15, 35, 0.75); border: 1px solid #00f3ff; padding: 10px 18px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
    .hud-label { font-size: 11px; color: #00f3ff; letter-spacing: 1px; }
    .hud-val { font-size: 24px; font-weight: 800; margin-top: 2px; }

    /* Overlay Screens */
    .overlay { position: fixed; inset: 0; background: rgba(5, 5, 16, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; text-align: center; padding: 20px; }
    .hidden { display: none !important; }
    h1 { font-size: 42px; letter-spacing: 4px; color: #00f3ff; text-shadow: 0 0 20px #00f3ff, 0 0 40px #ff007f; margin-bottom: 12px; }
    p { color: #b8c4e0; font-size: 15px; max-width: 400px; line-height: 1.5; margin-bottom: 28px; }
    button { background: linear-gradient(90deg, #00f3ff, #ff007f); border: none; color: #fff; font-size: 18px; font-weight: bold; padding: 14px 36px; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); transition: transform 0.15s; }
    button:active { transform: scale(0.95); }

    /* Mobile Controls */
    #mobile-controls { position: fixed; bottom: 24px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 15; pointer-events: none; }
    .ctrl-group { display: flex; gap: 12px; pointer-events: auto; }
    .ctrl-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(0, 243, 255, 0.15); border: 2px solid #00f3ff; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    .ctrl-btn:active { background: rgba(0, 243, 255, 0.45); }
    #btn-boost { width: 84px; border-radius: 32px; border-color: #ff007f; background: rgba(255, 0, 127, 0.2); font-size: 14px; font-weight: bold; }
    #btn-boost:active { background: rgba(255, 0, 127, 0.5); }
  </style>
</head>
<body>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="score">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">SPEED</div>
      <div class="hud-val"><span id="speed">120</span> km/h</div>
    </div>
  </div>

  <div id="start-screen" class="overlay">
    <h1>NEON DRIVE 3D</h1>
    <p>좌우로 차선을 변경해 장애물을 피하세요.<br>PC: 방향키(◀ ▶) &amp; 부스터(▲ / Space)<br>모바일: 하단 버튼 또는 화면 좌우 터치</p>
    <button id="start-btn">START ENGINE</button>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1 style="color:#ff007f;">CRASHED!</h1>
    <p>최종 점수: <strong id="final-score" style="color:#fff; font-size:22px;">0</strong></p>
    <button id="restart-btn">PLAY AGAIN</button>
  </div>

  <div id="mobile-controls">
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btn-boost">BOOST</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, playerCar, gridHelper;
    let obstacles = [];
    let isPlaying = false, isBoosting = false;
    let score = 0, currentLane = 0; // -1, 0, 1
    const laneWidth = 3.2;
    let shakeTime = 0;

    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050510, 0.022);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 4.2, 8.5);
      camera.lookAt(0, 1, -10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0x00f3ff, 1);
      dirLight.position.set(5, 12, 8);
      scene.add(dirLight);

      // Road & Neon Grid
      const roadGeo = new THREE.PlaneGeometry(12, 300);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x0b0d1f, roughness: 0.8 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.z = -120;
      scene.add(road);

      gridHelper = new THREE.GridHelper(300, 60, 0xff007f, 0x1e254d);
      gridHelper.position.y = 0.02;
      gridHelper.position.z = -120;
      scene.add(gridHelper);

      // Player Car
      playerCar = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.6, 0.65, 3.2);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x005577, metalness: 0.7, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.55;
      playerCar.add(body);

      const cabinGeo = new THREE.BoxGeometry(1.2, 0.5, 1.5);
      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.1 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 1.05, -0.2);
      playerCar.add(cabin);

      // Tail Lights
      const tailGeo = new THREE.BoxGeometry(1.4, 0.18, 0.1);
      const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
      const tail = new THREE.Mesh(tailGeo, tailMat);
      tail.position.set(0, 0.6, 1.61);
      playerCar.add(tail);

      scene.add(playerCar);

      window.addEventListener('resize', onResize);
      setupControls();
      animate();
    }

    function spawnObstacle() {
      const lanes = [-1, 0, 1];
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      const geo = new THREE.BoxGeometry(1.8, 1.3, 1.8);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff007f, emissive: 0x660033, roughness: 0.3 });
      const obs = new THREE.Mesh(geo, mat);
      obs.position.set(lane * laneWidth, 0.65, -130);
      scene.add(obs);
      obstacles.push(obs);
    }

    function resetGame() {
      obstacles.forEach(o => scene.remove(o));
      obstacles = [];
      score = 0;
      currentLane = 0;
      playerCar.position.x = 0;
      isBoosting = false;
      isPlaying = true;
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
    }

    function gameOver() {
      isPlaying = false;
      shakeTime = 18;
      finalScoreEl.textContent = Math.floor(score);
      gameoverScreen.classList.remove('hidden');
    }

    function moveLane(dir) {
      if (!isPlaying) return;
      currentLane = Math.max(-1, Math.min(1, currentLane + dir));
    }

    function setupControls() {
      document.getElementById('start-btn').onclick = resetGame;
      document.getElementById('restart-btn').onclick = resetGame;

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') isBoosting = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') isBoosting = false;
      });

      const btnLeft = document.getElementById('btn-left');
      const btnRight = document.getElementById('btn-right');
      const btnBoost = document.getElementById('btn-boost');

      btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLane(-1); });
      btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveLane(1); });
      btnLeft.addEventListener('mousedown', () => moveLane(-1));
      btnRight.addEventListener('mousedown', () => moveLane(1));

      btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
      btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });
      btnBoost.addEventListener('mousedown', () => isBoosting = true);
      btnBoost.addEventListener('mouseup', () => isBoosting = false);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let spawnTimer = 0;
    function animate() {
      requestAnimationFrame(animate);

      const baseSpeed = isPlaying ? (0.75 + Math.min(score * 0.0003, 0.8)) : 0.25;
      const currentSpeed = isBoosting && isPlaying ? baseSpeed * 1.65 : baseSpeed;

      // Grid scroll
      gridHelper.position.z += currentSpeed;
      if (gridHelper.position.z > -90) gridHelper.position.z = -120;

      // Smooth car steering & tilt
      const targetX = currentLane * laneWidth;
      playerCar.position.x += (targetX - playerCar.position.x) * 0.16;
      playerCar.rotation.z = (playerCar.position.x - targetX) * 0.12;

      // FOV boost effect
      const targetFov = isBoosting && isPlaying ? 78 : 65;
      camera.fov += (targetFov - camera.fov) * 0.1;
      camera.updateProjectionMatrix();

      // Camera shake
      if (shakeTime > 0) {
        camera.position.x = (Math.random() - 0.5) * 0.5;
        camera.position.y = 4.2 + (Math.random() - 0.5) * 0.5;
        shakeTime--;
      } else {
        camera.position.x += (playerCar.position.x * 0.35 - camera.position.x) * 0.1;
        camera.position.y = 4.2;
      }

      if (isPlaying) {
        score += currentSpeed * (isBoosting ? 2.2 : 1);
        scoreEl.textContent = Math.floor(score);
        speedEl.textContent = Math.floor(currentSpeed * 160);

        spawnTimer += currentSpeed;
        if (spawnTimer > 26) {
          spawnObstacle();
          spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += currentSpeed;

          // Collision check
          if (Math.abs(obs.position.z - playerCar.position.z) < 2.1 &&
              Math.abs(obs.position.x - playerCar.position.x) < 1.4) {
            gameOver();
          }

          if (obs.position.z > 15) {
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
